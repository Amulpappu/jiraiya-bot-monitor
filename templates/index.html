<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jiraiya Financial Intelligence & Bot Monitor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #090B14; color: #E2E8F0; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #20283C; padding-bottom: 20px; margin-bottom: 20px; }
        h1 { color: #6C4DFF; margin: 0; font-size: 28px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background-color: #131826; border: 1px solid #20283C; border-radius: 12px; padding: 20px; }
        .card-title { color: #94A3B8; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .card-value { font-size: 28px; font-weight: bold; margin-top: 10px; color: #19D96B; }
        .badge { background-color: #1E1B4B; color: #6C4DFF; padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌀 Jiraiya Financial Intelligence & Bot Monitor</h1>
            <span class="badge">🟢 Live Synced</span>
        </div>
        <div class="card-grid">
            <div class="card">
                <div class="card-title">Total Revenue</div>
                <div class="card-value" id="tot-rev">Loading...</div>
            </div>
            <div class="card">
                <div class="card-title">Services (Civ ₹7k / Govt ₹10k)</div>
                <div class="card-value" id="srv-rev">Loading...</div>
            </div>
            <div class="card">
                <div class="card-title">Upgrades Revenue</div>
                <div class="card-value" id="upg-rev">Loading...</div>
            </div>
            <div class="card">
                <div class="card-title">Kits Revenue</div>
                <div class="card-value" id="kit-rev">Loading...</div>
            </div>
        </div>
    </div>
    <script>
        async function fetchDashboard() {
            try {
                const res = await fetch('/api/dashboard');
                const data = await res.json();
                if(data.success) {
                    document.getElementById('tot-rev').innerText = '₹' + data.total_revenue.toLocaleString();
                    document.getElementById('srv-rev').innerText = '₹' + data.service_revenue.toLocaleString();
                    document.getElementById('upg-rev').innerText = '₹' + data.upgrade_revenue.toLocaleString();
                    document.getElementById('kit-rev').innerText = '₹' + data.kit_revenue.toLocaleString();
                }
            } catch(e) {}
        }
        fetchDashboard();
        setInterval(fetchDashboard, 10000);
    </script>
</body>
</html>
